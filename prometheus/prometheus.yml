global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "fastapi-backend"
    static_configs:
      - targets: ["backend:8000"]

  - job_name: "parser-worker"
    static_configs:
      - targets: ["parser:9101"]

  - job_name: "embedding-worker"
    static_configs:
      - targets: ["embedding:9102"]
